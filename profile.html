<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trotter · Globetrotter 2025 Atlas</title>
<link rel="stylesheet" href="styles.css" />
<style>
.cb{ font-family:var(--ff-mono); font-size:12px; color:var(--steel); padding:22px 0 0; }
.cb a:hover{ color:var(--gold); }

/* profile hero */
.phero{ display:flex; align-items:center; gap:24px; padding:26px 0 30px; flex-wrap:wrap; }
.phero .av{ width:88px; height:88px; border-radius:18px; background:var(--ink); color:var(--cream); font-family:var(--ff-display); font-size:38px; display:grid; place-items:center; flex:none; border:1px solid var(--line); }
.phero h1{ font-family:var(--ff-display); text-transform:uppercase; font-size:clamp(34px,5vw,58px); color:var(--cream); margin:0; line-height:.95; }
.phero .handle{ font-family:var(--ff-mono); font-size:13px; color:var(--steel); margin-top:6px; }
.phero .spacer{ flex:1; }
.phero .rank{ text-align:right; }
.phero .rank .big{ font-family:var(--ff-display); font-size:54px; color:var(--col); line-height:1; }
.phero .rank .lbl{ font-family:var(--ff-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--steel); margin-top:4px; }

.pstats{ display:grid; grid-template-columns:repeat(4,1fr); border:1px solid var(--line); border-radius:12px; overflow:hidden; background:rgba(255,255,255,.025); margin-bottom:8px; }
.pstats .f{ padding:16px 20px; border-left:1px solid var(--line); }
.pstats .f:first-child{ border-left:none; }
.pstats .f .v{ font-family:var(--ff-display); font-size:23px; color:var(--gold); }
.pstats .f .l{ font-family:var(--ff-mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--steel); margin-top:4px; }
@media(max-width:760px){ .pstats{ grid-template-columns:1fr 1fr; } }

.tier-prog{ border:1px solid var(--line); border-radius:12px; padding:16px 20px; background:rgba(255,255,255,.025); margin:14px 0 0; }
.tier-prog .row{ display:flex; align-items:center; gap:12px; font-family:var(--ff-mono); font-size:12px; color:var(--steel); margin-bottom:9px; }
.tier-prog .bar{ height:9px; border-radius:99px; background:rgba(255,255,255,.07); overflow:hidden; }
.tier-prog .bar i{ display:block; height:100%; background:var(--col); border-radius:99px; }

.layout{ display:grid; grid-template-columns:1fr 360px; gap:34px; align-items:start; margin-top:40px; }
@media(max-width:920px){ .layout{ grid-template-columns:1fr; } }

.section-h{ display:flex; align-items:center; gap:14px; margin-bottom:18px; }
.section-h h2{ font-family:var(--ff-display); text-transform:uppercase; font-size:24px; color:var(--cream); }
.section-h .ln{ flex:1; height:1px; background:var(--line); }
.section-h .meta{ font-family:var(--ff-mono); font-size:11.5px; color:var(--steel); }

.journey .cap{ font-family:var(--ff-mono); font-size:11px; color:var(--steel); padding:12px 16px; border-top:1px solid var(--line); display:flex; justify-content:space-between; }

/* timeline */
.timeline{ position:relative; }
.tl-item{ display:flex; gap:16px; padding:0 0 4px; }
.tl-rail{ display:flex; flex-direction:column; align-items:center; flex:none; }
.tl-num{ width:30px; height:30px; border-radius:999px; background:var(--gold); color:#1a1206; font-family:var(--ff-mono); font-weight:700; font-size:13px; display:grid; place-items:center; }
.tl-line{ width:2px; flex:1; background:linear-gradient(var(--gold),rgba(216,162,76,.2)); margin:4px 0; min-height:20px; }
.tl-item:last-child .tl-line{ display:none; }
.tl-card{ flex:1; border:1px solid var(--line); border-radius:12px; background:rgba(255,255,255,.025); padding:14px 16px; margin-bottom:20px; transition:.16s; display:flex; gap:14px; align-items:center; }
.tl-card:hover{ border-color:var(--gold); transform:translateX(2px); }
.tl-card .thumb{ width:74px; height:58px; border-radius:7px; overflow:hidden; border:2px solid #fff; flex:none; }
.tl-card .thumb .photo{ width:100%; height:100%; }
.tl-card .body{ flex:1; min-width:0; }
.tl-card .date{ font-family:var(--ff-mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); }
.tl-card .city{ font-family:var(--ff-display); text-transform:uppercase; font-size:18px; color:var(--cream); margin:3px 0 2px; }
.tl-card .blurb{ font-size:13px; color:var(--cream-2); line-height:1.5; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.tl-card .arrow{ font-family:var(--ff-mono); color:var(--steel); flex:none; }
</style>
</head>
<body>
<div id="header"></div>
<main class="wrap" id="root" data-screen-label="Trotter profile"></main>
<div id="footer"></div>

<script src="data.js"></script>
<script src="site.js"></script>
<script src="chart.js"></script>
<script>
mountChrome("contributors");

const key = new URLSearchParams(location.search).get("id") || "rhys";
const m = CONTRIBUTORS[key];
const root = document.getElementById("root");

if(!m){
  root.innerHTML = `<div style="padding:80px 0; text-align:center">
    <div class="eyebrow">404 · Unknown trotter</div>
    <h1 class="display" style="font-size:48px; margin:14px 0">No such member</h1>
    <a class="btn btn-primary" href="contributors.html">Back to the trotters</a></div>`;
} else {
  const subs = submissionsBy(key);                       // chronological
  const col = m.tier ? TIER_COLOR[m.tier] : "var(--steel)";
  const cities = [...new Set(subs.map(s=>s.cityId))];
  const countries = [...new Set(subs.map(s=>cityOf(s).country))];
  const continents = [...new Set(subs.map(s=>cityOf(s).continent))];
  const photoTotal = subs.reduce((n,s)=>n+s.photos.length,0);

  // tier progress
  const next = m.count>=15?null : m.count>=10?["Gold",15] : m.count>=5?["Silver",10] : ["Bronze",5];
  const target = next?next[1]:15; const pct=Math.min(100,Math.round(m.count/target*100));

  root.innerHTML = `
  <nav class="cb"><a href="contributors.html">Trotters</a> ／ <span style="color:var(--cream-2)">${m.display}</span></nav>

  <section class="phero" style="--col:${col}">
    <span class="av">${m.display[0]}</span>
    <div>
      <h1>${m.display}</h1>
      <div class="handle">@${m.handle}${m.role?` · ${m.role}`:""}</div>
    </div>
    <span class="spacer"></span>
    <div class="rank">
      <div class="big">${m.count}</div>
      <div class="lbl">${m.tier?TIER_LABEL[m.tier]+" · ":""}cities stamped</div>
    </div>
  </section>

  <div class="pstats">
    <div class="f"><div class="v">${subs.length}</div><div class="l">In the atlas</div></div>
    <div class="f"><div class="v">${countries.length}</div><div class="l">Countries</div></div>
    <div class="f"><div class="v">${continents.length}</div><div class="l">Continents</div></div>
    <div class="f"><div class="v">${photoTotal}</div><div class="l">Photos</div></div>
  </div>

  <div class="tier-prog" style="--col:${col}">
    <div class="row"><span>${m.tier?TIER_LABEL[m.tier]+" trotter":"On the trail"}</span><span style="margin-left:auto">${next?`${target-m.count} to ${next[0]}`:"Max rank — Gold ★"}</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
  </div>

  <div class="layout">
    <div>
      <div class="section-h"><h2>The Journey</h2><div class="ln"></div><span class="meta">${subs.length} stops · in order</span></div>
      <div class="timeline" id="timeline"></div>
    </div>
    <aside>
      <div class="section-h"><h2 style="font-size:20px">Their Map</h2><div class="ln"></div></div>
      <div class="chart-wrap journey">
        <div class="chart" id="journey"></div>
        <div class="cap"><span>Chronological · ${subs[0]?subs[0].date.slice(0,7):''} → ${subs.length?subs[subs.length-1].date.slice(0,7):''}</span></div>
      </div>
      <div style="font-family:var(--ff-mono); font-size:11px; color:var(--steel); margin-top:12px; line-height:1.6">
        Pins numbered in the order ${m.display.split(" ")[0]} submitted them through 2025. The dashed line traces the year's path.
      </div>
      <a class="btn btn-ghost" style="width:100%; justify-content:center; margin-top:16px" href="atlas.html?member=${key}">All ${m.display.split(" ")[0]}'s submissions →</a>
    </aside>
  </div>
  <div style="height:50px"></div>`;

  /* timeline */
  document.getElementById("timeline").innerHTML = subs.map((s,i)=>{
    const c=cityOf(s);
    return `<a class="tl-item" href="city.html?id=${c.id}#${s.id}" style="text-decoration:none">
      <div class="tl-rail"><div class="tl-num">${i+1}</div><div class="tl-line"></div></div>
      <div class="tl-card">
        <div class="thumb">${photoHTML(s.photos[0],{glyph:false})}</div>
        <div class="body">
          <div class="date">${s.date} · ${flag(c.cc)} ${c.country}</div>
          <div class="city">${c.name}</div>
          <div class="blurb">${s.blurb||""}</div>
        </div>
        <span class="arrow">→</span>
      </div>
    </a>`;
  }).join("");

  /* journey map: numbered pins + path in chronological order */
  const journeyEl = document.getElementById("journey");
  const { projPct: proj, drawPath } = buildChart(journeyEl, { labels:false, stars:true });
  const pts = subs.map(s=>{ const c=cityOf(s); return {lat:c.lat,lng:c.lng}; });
  drawPath(pts, { color: col });
  subs.forEach((s,i)=>{
    const c=cityOf(s); const p=proj(c.lat,c.lng);
    const pin=document.createElement("a");
    pin.className="pin num"; pin.href=`city.html?id=${c.id}#${s.id}`;
    pin.style.left=p.x+"%"; pin.style.top=p.y+"%"; pin.style.setProperty("--col",col);
    pin.innerHTML=`<span class="seq">${i+1}</span>`;
    pin.title=`${i+1}. ${c.name} — ${s.date}`;
    journeyEl.appendChild(pin);
  });

  document.title = `${m.display} · Globetrotter 2025 Atlas`;
}
</script>
</body>
</html>
