<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Submissions · Globetrotter 2025 Atlas</title>
<link rel="stylesheet" href="styles.css" />
<style>
.atlas-hero{ padding:46px 0 30px; }
.atlas-hero h1{ font-family:var(--ff-display); text-transform:uppercase; font-size:clamp(36px,5vw,60px); color:var(--cream); margin:12px 0 14px; }
.atlas-hero p{ font-family:var(--ff-mono); font-size:14px; color:var(--steel); max-width:600px; line-height:1.7; }

.toolbar{ display:flex; flex-wrap:wrap; gap:14px 18px; align-items:center; justify-content:space-between; padding:20px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); margin-bottom:30px; position:sticky; top:67px; background:rgba(10,18,40,.88); backdrop-filter:blur(12px); z-index:20; }
.filters{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.flabel{ font-family:var(--ff-mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--steel-2); margin-right:2px; }
.chip{ font-family:var(--ff-mono); font-size:12px; letter-spacing:.04em; text-transform:uppercase; color:var(--steel); background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:999px; padding:8px 14px; cursor:pointer; transition:.16s; }
.chip:hover{ color:var(--cream); border-color:var(--steel-2); }
.chip.active{ background:var(--gold); color:var(--navy); border-color:var(--gold); font-weight:700; }
.search{ display:flex; align-items:center; gap:9px; background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:999px; padding:9px 16px; }
.search input{ background:none; border:none; outline:none; color:var(--cream); font-family:var(--ff-mono); font-size:13px; width:150px; }
.search input::placeholder{ color:var(--steel-2); }
.sortsel{ font-family:var(--ff-mono); font-size:12px; color:var(--cream); background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:999px; padding:8px 12px; cursor:pointer; }

.count-line{ font-family:var(--ff-mono); font-size:12px; color:var(--steel); margin-bottom:22px; }

.sub-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:26px 22px; }
@media(max-width:1040px){ .sub-grid{ grid-template-columns:repeat(3,1fr); } }
@media(max-width:760px){ .sub-grid{ grid-template-columns:repeat(2,1fr); } .toolbar{ position:static; } }
@media(max-width:460px){ .sub-grid{ grid-template-columns:1fr; } }

.scard{ background:var(--parch); border-radius:7px; padding:11px 11px 13px; box-shadow:0 12px 28px rgba(0,0,0,.34); transition:.2s; color:#2A2418; display:block; }
.scard:hover{ transform:translateY(-4px); box-shadow:0 22px 44px rgba(0,0,0,.5); }
.scard .pic{ position:relative; aspect-ratio:4/3; border-radius:3px; overflow:hidden; border:3px solid #fff; }
.scard .pic .photo{ width:100%; height:100%; }
.scard .ovl{ position:absolute; right:7px; bottom:7px; background:rgba(236,227,204,.86); font-size:11px; padding:4px 9px; }
.scard .multi{ position:absolute; left:7px; top:7px; background:var(--orange); color:#1a1206; font-family:var(--ff-mono); font-weight:700; font-size:9.5px; letter-spacing:.04em; padding:3px 7px; border-radius:999px; }
.scard .nm{ font-family:var(--ff-display); text-transform:uppercase; font-size:17px; color:#2A2418; line-height:1; margin-top:10px; }
.scard .meta{ font-family:var(--ff-mono); font-size:10px; color:#6B6048; margin-top:5px; letter-spacing:.04em; }
.scard .ft{ display:flex; align-items:center; gap:6px; margin-top:9px; padding-top:8px; border-top:1px dashed #C7B894; font-family:var(--ff-mono); font-size:10.5px; color:#7A6C4A; }
.scard .ft .av{ width:18px; height:18px; border-radius:4px; background:var(--ink); color:#fff; font-size:9px; font-weight:700; display:grid; place-items:center; }
.scard .ft .dt{ margin-left:auto; }
.empty{ grid-column:1/-1; text-align:center; padding:60px 0; font-family:var(--ff-mono); color:var(--steel); }
</style>
</head>
<body>
<div id="header"></div>

<main class="wrap" data-screen-label="Submissions / Browse">
  <section class="atlas-hero">
    <span class="eyebrow">Every Entry · 2025</span>
    <h1>All Submissions</h1>
    <p>Every city write-up posted to the challenge — one card per submission. The same city can appear more than once when different trotters visited. Filter by continent or member, or search.</p>
  </section>

  <div class="toolbar">
    <div class="filters">
      <span class="flabel">Region</span>
      <div class="filters" id="continent-filters" style="gap:7px"></div>
    </div>
    <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap">
      <select class="sortsel" id="member-filter"></select>
      <select class="sortsel" id="sort"></select>
      <label class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--steel)" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" placeholder="Search a city…" />
      </label>
    </div>
  </div>

  <div class="count-line" id="count-line"></div>
  <div class="sub-grid" id="grid"></div>
  <div style="height:50px"></div>
</main>

<div id="footer"></div>

<script src="data.js"></script>
<script src="site.js"></script>
<script>
mountChrome("atlas");

const CONTINENTS=["All",...Array.from(new Set(submittedCities().map(c=>c.continent))).sort()];
let activeCont="All", activeMember="all", query="", sortBy="recent";

/* continent chips */
const filterEl=document.getElementById("continent-filters");
filterEl.innerHTML=CONTINENTS.map(ct=>{
  const n = ct==="All" ? SUBMISSIONS.length : SUBMISSIONS.filter(s=>cityOf(s).continent===ct).length;
  return `<button class="chip ${ct==='All'?'active':''}" data-ct="${ct}">${ct} <span style="opacity:.6">${n}</span></button>`;
}).join("");

/* member dropdown */
const members=Object.entries(CONTRIBUTORS).sort((a,b)=>b[1].count-a[1].count);
document.getElementById("member-filter").innerHTML =
  `<option value="all">All trotters</option>` +
  members.map(([k,v])=>`<option value="${k}">${v.display} (${submissionsBy(k).length})</option>`).join("");

/* sort dropdown */
document.getElementById("sort").innerHTML =
  `<option value="recent">Newest first</option><option value="oldest">Oldest first</option><option value="city">City A–Z</option><option value="reacted">Most reacted</option>`;

function render(){
  let list=SUBMISSIONS.slice();
  if(activeCont!=="All") list=list.filter(s=>cityOf(s).continent===activeCont);
  if(activeMember!=="all") list=list.filter(s=>s.submittedBy===activeMember);
  if(query){ const q=query.toLowerCase(); list=list.filter(s=>{const c=cityOf(s); return (c.name+" "+c.country).toLowerCase().includes(q);}); }
  if(sortBy==="recent") list.sort((a,b)=>b.date.localeCompare(a.date));
  else if(sortBy==="oldest") list.sort((a,b)=>a.date.localeCompare(b.date));
  else if(sortBy==="city") list.sort((a,b)=>cityOf(a).name.localeCompare(cityOf(b).name));
  else if(sortBy==="reacted") list.sort((a,b)=>totalReacts(b)-totalReacts(a));

  document.getElementById("count-line").textContent =
    `${list.length} submission${list.length===1?'':'s'}`+
    (activeCont!=="All"?` · ${activeCont}`:"")+
    (activeMember!=="all"?` · ${contributor(activeMember).display}`:"")+
    (query?` · “${query}”`:"");

  const grid=document.getElementById("grid");
  if(!list.length){ grid.innerHTML=`<div class="empty">No submissions match — try another filter.</div>`; return; }
  grid.innerHTML=list.map(s=>{
    const c=cityOf(s); const sub=contributor(s.submittedBy);
    const others=submissionCount(c.id);
    return `<a class="scard" href="city.html?id=${c.id}#${s.id}">
      <div class="pic">${photoHTML(s.photos[0])}
        ${others>1?`<span class="multi">${others} submissions</span>`:""}
        <span class="stamp ovl">${flag(c.cc)} ${c.cc}</span>
      </div>
      <div class="nm">${c.name}</div>
      <div class="meta">${c.country.toUpperCase()} · POP ${fmtPop(c.population)}</div>
      <div class="ft"><span class="av">${sub.display[0]}</span>${sub.display}<span class="dt">${s.date.slice(0,7)}</span></div>
    </a>`;
  }).join("");
}

filterEl.addEventListener("click",e=>{ const b=e.target.closest(".chip"); if(!b)return; activeCont=b.dataset.ct;
  filterEl.querySelectorAll(".chip").forEach(x=>x.classList.toggle("active",x===b)); render(); });
document.getElementById("member-filter").addEventListener("change",e=>{ activeMember=e.target.value; render(); });
document.getElementById("sort").addEventListener("change",e=>{ sortBy=e.target.value; render(); });
document.getElementById("search").addEventListener("input",e=>{ query=e.target.value; render(); });

/* deep links: ?member= / ?continent= */
const ps=new URLSearchParams(location.search);
const pm=ps.get("member"); if(pm && CONTRIBUTORS[pm]){ activeMember=pm; document.getElementById("member-filter").value=pm; }
const pc=ps.get("continent"); if(pc && CONTINENTS.includes(pc)){ activeCont=pc; filterEl.querySelectorAll(".chip").forEach(x=>x.classList.toggle("active",x.dataset.ct===pc)); }
render();
</script>
</body>
</html>
