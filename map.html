<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>World Map · Globetrotter 2025 Atlas</title>
<link rel="stylesheet" href="styles.css" />
<style>
.map-hero{ padding:42px 0 24px; display:flex; align-items:flex-end; justify-content:space-between; gap:24px; flex-wrap:wrap; }
.map-hero h1{ font-family:var(--ff-display); text-transform:uppercase; font-size:clamp(34px,4.6vw,56px); color:var(--cream); margin:10px 0 0; }
.map-hero p{ font-family:var(--ff-mono); font-size:13px; color:var(--steel); max-width:480px; line-height:1.7; margin:12px 0 0; }
.map-filters{ display:flex; flex-wrap:wrap; gap:7px; }
.mchip{ font-family:var(--ff-mono); font-size:11.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--steel); background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:999px; padding:7px 13px; cursor:pointer; transition:.16s; }
.mchip:hover{ color:var(--cream); }
.mchip.active{ background:var(--gold); color:var(--navy); border-color:var(--gold); font-weight:700; }

.layout{ display:grid; grid-template-columns:1fr 300px; gap:26px; align-items:start; }
@media(max-width:920px){ .layout{ grid-template-columns:1fr; } }

.side-list{ border:1px solid var(--line); border-radius:14px; background:rgba(255,255,255,.025); overflow:hidden; }
.side-list .hd{ padding:15px 18px; border-bottom:1px solid var(--line); font-family:var(--ff-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--steel); display:flex; justify-content:space-between; }
.side-list .scroll{ max-height:560px; overflow:auto; }
.li{ display:flex; align-items:center; gap:11px; padding:11px 18px; border-top:1px solid var(--line-2); cursor:pointer; transition:.14s; }
.li:first-child{ border-top:none; }
.li:hover{ background:rgba(216,162,76,.08); }
.li .fl{ font-size:16px; }
.li .nm{ font-weight:600; font-size:14px; color:var(--cream); }
.li .co{ font-family:var(--ff-mono); font-size:10.5px; color:var(--steel); }
.li .cnt{ margin-left:auto; font-family:var(--ff-mono); font-size:10px; color:var(--gold); background:rgba(216,162,76,.12); border:1px solid rgba(216,162,76,.3); border-radius:999px; padding:3px 8px; }
.li.hidden{ display:none; }
</style>
</head>
<body>
<div id="header"></div>

<main class="wrap" data-screen-label="World Map">
  <div class="map-hero">
    <div>
      <span class="eyebrow">Six continents · One year</span>
      <h1>The World Map</h1>
      <p>Every city with a submission, plotted by latitude and longitude. Hover a pin to preview, click to open the city. Cities with more than one submission carry a count.</p>
    </div>
    <div class="map-filters" id="map-filters"></div>
  </div>

  <div class="layout">
    <div class="chart-wrap">
      <div class="chart" id="chart"></div>
      <div class="chart-legend">
        <span class="d"><span class="dot"></span> City with a submission</span>
        <span class="d" id="legend-count"></span>
        <span class="d" style="margin-left:auto; color:var(--steel-2)">Equirectangular projection · hover to preview</span>
      </div>
    </div>
    <aside class="side-list">
      <div class="hd"><span id="list-title">All cities</span><span id="list-count"></span></div>
      <div class="scroll" id="city-list"></div>
    </aside>
  </div>
  <div style="height:50px"></div>
</main>

<div id="footer"></div>

<script src="data.js"></script>
<script src="site.js"></script>
<script src="chart.js"></script>
<script>
mountChrome("map");

const chartEl = document.getElementById("chart");
const { projPct: proj } = buildChart(chartEl, { labels:true, stars:true });

const cities = submittedCities();
const tip = document.createElement("div"); tip.className="tooltip"; chartEl.appendChild(tip);

/* one pin per city */
const pins = [];
cities.forEach(c=>{
  const subs = submissionsForCity(c.id);
  const p = proj(c.lat,c.lng);
  const el = document.createElement("a");
  el.className = "pin"; el.href = "city.html?id="+c.id;
  el.style.left = p.x+"%"; el.style.top = p.y+"%";
  el.dataset.cont = c.continent; el.dataset.id = c.id;
  if (subs.length>1) el.innerHTML = `<span class="cbadge">${subs.length}</span>`;
  el.addEventListener("mouseenter",()=>{
    const names = [...new Set(subs.map(s=>contributor(s.submittedBy).display))];
    tip.innerHTML = photoHTML(subs[0].photos[0]) +
      `<div class="nm">${c.name}</div><div class="co">${flag(c.cc)} ${c.country} · ${subs.length} submission${subs.length>1?'s':''}</div>`;
    tip.style.left=p.x+"%"; tip.style.top=p.y+"%"; tip.classList.add("show");
  });
  el.addEventListener("mouseleave",()=>tip.classList.remove("show"));
  chartEl.appendChild(el); pins.push({el,c});
});

/* filters */
const conts=["All",...Array.from(new Set(cities.map(c=>c.continent))).sort()];
const mf=document.getElementById("map-filters");
mf.innerHTML=conts.map(ct=>`<button class="mchip ${ct==='All'?'active':''}" data-ct="${ct}">${ct}</button>`).join("");
let active="All", focusId=null;
function applyFilter(){
  let shown=0;
  pins.forEach(({el,c})=>{ const on=active==="All"||c.continent===active; el.classList.toggle("dim",!on); if(on)shown++; });
  document.querySelectorAll(".li").forEach(li=>{ const on=active==="All"||li.dataset.cont===active; li.classList.toggle("hidden",!on); });
  document.getElementById("legend-count").textContent=`${shown} of ${cities.length} cities`;
  document.getElementById("list-title").textContent=active==="All"?"All cities":active;
  document.getElementById("list-count").textContent=shown;
}
mf.addEventListener("click",e=>{ const b=e.target.closest(".mchip"); if(!b)return; active=b.dataset.ct;
  mf.querySelectorAll(".mchip").forEach(x=>x.classList.toggle("active",x===b)); applyFilter(); });

/* side list */
const list=document.getElementById("city-list");
list.innerHTML = cities.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(c=>{
  const n=submissionCount(c.id);
  return `<a class="li" href="city.html?id=${c.id}" data-cont="${c.continent}" data-id="${c.id}">
    <span class="fl">${flag(c.cc)}</span>
    <span><span class="nm">${c.name}</span><br><span class="co">${c.country}</span></span>
    <span class="cnt">${n}</span></a>`;
}).join("");
list.querySelectorAll(".li").forEach(li=>{
  li.addEventListener("mouseenter",()=>{ const pin=chartEl.querySelector(`.pin[data-id="${li.dataset.id}"]`); if(pin)pin.classList.add("focus"); });
  li.addEventListener("mouseleave",()=>{ const pin=chartEl.querySelector(`.pin[data-id="${li.dataset.id}"]`); if(pin && pin.dataset.id!==focusId)pin.classList.remove("focus"); });
});

applyFilter();

/* focus param */
const fp=new URLSearchParams(location.search).get("focus");
if(fp){ const pin=chartEl.querySelector(`.pin[data-id="${fp}"]`); if(pin){ focusId=fp; pin.classList.add("focus"); } }
</script>
</body>
</html>
